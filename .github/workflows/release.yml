name: Create Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'VERSION.json'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate version
        run: npm run version:generate

      - name: Read version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build extension for all browsers
        env:
          VITE_PHRASES_MANIFEST_URL: ${{ vars.VITE_PHRASES_MANIFEST_URL }}
        run: |
          npm run build:chromium
          zip -r duel-analyzer-chromium-${{ steps.version.outputs.version }}.zip dist -x "dist/.git*" "dist/node_modules/*"
          
          # Clean dist for Firefox build
          rm -rf dist
          npm run build:firefox
          zip -r duel-analyzer-firefox-${{ steps.version.outputs.version }}.zip dist -x "dist/.git*" "dist/node_modules/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: |
            duel-analyzer-chromium-${{ steps.version.outputs.version }}.zip
            duel-analyzer-firefox-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
