name: Build Extension

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate version
        run: npm run version:generate

      - name: Build extension (${{ matrix.browser }})
        env:
          VITE_PHRASES_MANIFEST_URL: ${{ vars.VITE_PHRASES_MANIFEST_URL }}
        run: npm run build:${{ matrix.browser }}

      - name: Upload dist artifact (${{ matrix.browser }})
        uses: actions/upload-artifact@v4
        with:
          name: duel-analyzer-extension-${{ matrix.browser }}-dist
          path: dist
